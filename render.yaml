databases:
  - name: datapilot-db
    databaseName: datapilot
    user: postgres
    plan: free
    region: oregon

services:
  # 1. Redis Queue & Cache Service
  - type: redis
    name: datapilot-redis
    plan: free
    region: oregon
    ipAllowList: [] # internal private access only

  # 2. Python AI Microservice (FastAPI + Uvicorn)
  - type: web
    name: datapilot-ai
    runtime: python
    region: oregon
    plan: free
    rootDir: ai
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8001
      - key: PYTHONPATH
        value: .
      - key: REDIS_URL
        fromService:
          type: redis
          name: datapilot-redis
          property: connectionString
      - key: RESEND_API_KEY
        sync: false

  # 3. Node.js Express Backend API
  - type: web
    name: datapilot-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 8000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: datapilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: datapilot-redis
          property: connectionString
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: datapilot-ai
          property: host
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        fromService:
          type: web
          name: datapilot-backend
          property: url
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_FROM
        value: onboarding@resend.dev

  # 4. Vite React Frontend (Static SPA with Client-Side Routing)
  - type: web
    name: datapilot-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: datapilot-backend
          property: url
